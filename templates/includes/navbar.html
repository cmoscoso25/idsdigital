<nav class="navbar">
  <div class="nav-left">
    <a class="brand" href="/">Inteligencia Digital y Sistemas</a>
    <span class="pill">CRM</span>
  </div>

  <div class="nav-right">
    {% if request.user.is_authenticated %}
      <a class="nav-link" href="{% url 'crm:lead_list' %}">Leads</a>
      <a class="nav-link" href="{% url 'crm:demorequest_list' %}">Solicitudes</a>

      {% if request.workspace %}
        <a class="nav-link subtle" href="{% url 'accounts:workspace_select' %}">
          {{ request.workspace.name }}
        </a>
      {% endif %}

      <span class="nav-user">{{ request.user.get_full_name|default:request.user.username }}</span>
      <a class="btn ghost" href="{% url 'accounts:logout' %}">Salir</a>
    {% else %}
      <a class="btn primary" href="{% url 'accounts:login' %}">Ingresar</a>
    {% endif %}
  </div>
</nav>
