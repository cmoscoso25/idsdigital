  <circle cx="7" cy="52" r="3.5" fill="#60a5fa"/>
  <circle cx="50" cy="58" r="3.5" fill="#60a5fa"/>
  <circle cx="24" cy="62" r="3.5" fill="#60a5fa"/>

  <line x1="28" y1="35" x2="12" y2="26" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <line x1="28" y1="35" x2="44" y2="26" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <line x1="22" y1="47" x2="9" y2="50" stroke="#93c5fd" stroke-width="1" fill="none" opacity="0.7"/>
