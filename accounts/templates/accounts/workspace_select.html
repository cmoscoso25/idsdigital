{% extends "base.html" %}
{% block title %}Empresa | CRM{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="badge">WORKSPACE</div>
      <h1>Selecciona tu empresa</h1>
      <p>Tienes acceso a más de una empresa/unidad.</p>
    </div>

    <form method="post" class="form">
      {% csrf_token %}
      <label class="label">Empresa</label>
      {{ form.workspace_id }}
      <button class="btn primary" type="submit">Continuar</button>
    </form>
  </div>
</div>
{% endblock %}
